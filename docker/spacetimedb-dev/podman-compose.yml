version: "3.8"

# Phase 2 dev topology: two services on a shared podman network with hostname-based DNS
# resolution (not host networking), mirroring the conventions of the existing Arr Stack pod.
# This is a dev/proof pod, not the production topology (that's Phase 4) - it exists to prove
# the containerized Sonarr backend can reach a separate containerized SpacetimeDB service and
# round-trip the Tag flow end to end.
#
# JWT signing keys are mounted from ./keys so they survive spacetimedb restarts - without
# this, every restart regenerates ephemeral keys and silently invalidates every
# previously-issued identity token (manifests as a "broken pipe" error, not a clean auth
# error - see the plan's Phase 1 risk register for how this was found and confirmed fixed).
#
# The module itself is NOT auto-published on container start - see publish-module.sh. This
# host runs rootless podman with no unqualified-image-name resolution configured, so every
# image reference below is fully qualified.
services:
  spacetimedb:
    image: docker.io/clockworklabs/spacetime:latest
    container_name: sonarr-spacetimedb-dev
    command:
      - start
      - --data-dir
      - /stdb-data
      - --jwt-pub-key-path
      - /stdb-keys/id_ecdsa.pub
      - --jwt-priv-key-path
      - /stdb-keys/id_ecdsa
      - --non-interactive
    ports:
      - "3000:3000"
    volumes:
      - ./data:/stdb-data
      - ./keys:/stdb-keys
    networks:
      - sonarr-spacetimedb-dev-net

  sonarr:
    build:
      context: ../..
      dockerfile: docker/spacetimedb-dev/Dockerfile.sonarr
    container_name: sonarr-spacetimedb-dev-app
    depends_on:
      - spacetimedb
    environment:
      - SONARR__SPACETIMEDB__TAGREPOSITORYENABLED=true
      - SONARR__SPACETIMEDB__HOST=http://spacetimedb:3000
      - SONARR__SPACETIMEDB__DATABASE=sonarr-spacetime-dev
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr-config:/config
    networks:
      - sonarr-spacetimedb-dev-net

networks:
  sonarr-spacetimedb-dev-net:
    driver: bridge
